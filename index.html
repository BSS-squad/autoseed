<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Старый адрес AutoSeed ведёт на единый сайт Breaking Squad."
    />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="referrer" content="no-referrer" />
    <title>AutoSeed переехал — Breaking Squad</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 0;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: clamp(16px, 4vw, 48px);
        color: #f7f7f8;
        background:
          radial-gradient(circle at 15% 10%, rgb(216 42 42 / 24%), transparent 34rem),
          linear-gradient(145deg, #070708, #121217);
      }

      main {
        width: min(100%, 680px);
        padding: clamp(24px, 6vw, 56px);
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 24px;
        background: rgb(17 17 21 / 92%);
        box-shadow: 0 28px 80px rgb(0 0 0 / 44%);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #ff6969;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 4.25rem);
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      .lead {
        margin: 24px 0;
        color: #c9c9cf;
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border-radius: 12px;
        color: #fff;
        background: #ce2525;
        font-weight: 800;
        text-decoration: none;
      }

      a:hover {
        background: #e13232;
      }

      a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }

      .note {
        margin: 18px 0 0;
        color: #9d9da6;
        font-size: 0.92rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main data-autoseed-cutover>
      <p class="eyebrow">Breaking Squad</p>
      <h1>AutoSeed переехал</h1>
      <p class="lead">
        Открываем AutoSeed на основном сайте. Сохранённые ссылки на топы, журнал, баланс и
        победителей продолжат работать.
      </p>
      <a data-autoseed-fallback href="https://squad.leo-land.ru/autoseed">
        Открыть AutoSeed на основном сайте
      </a>
      <p class="note">Если автоматический переход не сработал, воспользуйтесь ссылкой.</p>
    </main>
    <script>
      (() => {
        'use strict';

        const canonicalOrigin = 'https://squad.leo-land.ru';
        const hash = window.location.hash;
        const knownHash =
          hash === '#leaderboards' ||
          hash.startsWith('#leaderboards?') ||
          hash === '#journal' ||
          hash.startsWith('#journal?') ||
          hash === '#balance' ||
          hash === '#winners' ||
          hash.startsWith('#winners?');
        const target = knownHash ? `${canonicalOrigin}/${hash}` : `${canonicalOrigin}/autoseed`;

        document.querySelector('[data-autoseed-fallback]').href = target;
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
